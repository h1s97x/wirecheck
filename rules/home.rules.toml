#
# Example rule set. All addresses are example.com or RFC 5737 documentation
# addresses; nothing here belongs to a real network.

version = 1
name = "home-network"
description = "Basic home connectivity checks."

[defaults]
timeout = "3s"
retries = 1
concurrency = 4

[redact]
ip = "mask"
user = "hash"
mac = "mask"

[vars]
gateway = "192.0.2.1"
resolver = "192.0.2.53"

[reports]
formats = ["json", "html"]
output_dir = "./reports"

[[probes]]
id = "dns_resolve"
type = "dns"
expect = { status = "ok", min_answers = 1 }

[probes.with]
server = "{{ vars.resolver }}"
query = "example.com"
record = "A"

[[probes]]
id = "gateway_ping"
type = "icmp"
depends_on = ["dns_resolve"]
expect = { packet_loss_below = 0.5 }

[probes.with]
target = "{{ vars.gateway }}"

[[probes]]
id = "portal_health"
type = "http"
expect = { status = 200, body_not_contains = "unavailable" }

[probes.with]
url = "https://example.com/health"
method = "GET"

[[probes]]
id = "system_proxy"
type = "proxy"
expect = { enabled = false }

[[remediations]]
for = "system_proxy"
id = "disable_system_proxy"
action = "proxy.set"
risk = "low"
needs_confirm = false

[remediations.params]
enabled = false

[remediations.rollback]
action = "proxy.set"

[remediations.rollback.params]
enabled = true
