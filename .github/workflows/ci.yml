name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Smoke test - validate example rule sets
        run: |
          cargo run -p wirecheck-cli -- validate --rules rules/home.rules.toml
          cargo run -p wirecheck-cli -- validate --rules rules/ci.rules.toml
          cargo run -p wirecheck-cli -- validate --rules rules/offline.rules.toml
          cargo run -p wirecheck-cli -- list-probes

      - name: Smoke test - offline run writes JSON + HTML reports
        run: cargo run -p wirecheck-cli -- run --rules rules/offline.rules.toml --output-dir ./reports --format json --format html

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check licenses, bans and sources
        run: cargo deny check licenses bans sources
